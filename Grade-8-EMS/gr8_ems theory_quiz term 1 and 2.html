<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 EMS Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fdf6ec;--card:#fff;--text:#2d2a3e;--muted:#9490a8;
  --green:#22c55e;--green-l:#dcfce7;--red:#ef4444;--red-l:#fee2e2;
  --shadow:0 4px 0 rgba(0,0,0,0.11);
}
body{background:var(--bg);background-image:radial-gradient(circle at 15% 15%,rgba(139,92,246,.08) 0%,transparent 50%),radial-gradient(circle at 85% 80%,rgba(249,115,22,.08) 0%,transparent 50%);min-height:100vh;font-family:'Nunito',sans-serif;color:var(--text);padding:1.5rem 1rem 4rem;display:flex;flex-direction:column;align-items:center;}

/* blobs */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.2;pointer-events:none;z-index:0;animation:blobF 8s ease-in-out infinite alternate;}
.b1{width:320px;height:320px;background:#c084fc;top:-90px;left:-90px;animation-delay:0s;}
.b2{width:260px;height:260px;background:#fb923c;bottom:-70px;right:-70px;animation-delay:3s;}
.b3{width:200px;height:200px;background:#34d399;top:45%;left:80%;animation-delay:5.5s;}
@keyframes blobF{from{transform:translate(0,0) scale(1);}to{transform:translate(18px,14px) scale(1.06);}}

.wrap{width:100%;max-width:640px;position:relative;z-index:1;}

/* HEADER */
.hdr{text-align:center;margin-bottom:1.8rem;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.hdr-emoji{font-size:3rem;display:block;margin-bottom:.3rem;animation:bounce 2.5s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.hdr h1{font-family:'Fredoka One',cursive;font-size:2rem;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.hdr p{font-size:.85rem;color:var(--muted);margin-top:.3rem;font-weight:700;}

/* STATS */
.stats{display:flex;gap:.7rem;justify-content:center;margin-bottom:1.4rem;flex-wrap:wrap;}
.spill{display:flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border-radius:99px;font-weight:800;font-size:.8rem;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.1);}
.spill.sc{color:#8b5cf6;} .spill.co{color:var(--green);} .spill.wr{color:var(--red);}
.sdot{width:8px;height:8px;border-radius:50%;}
.spill.sc .sdot{background:#8b5cf6;} .spill.co .sdot{background:var(--green);} .spill.wr .sdot{background:var(--red);}

/* PROGRESS */
.prog-area{margin-bottom:1.1rem;}
.prog-lbl{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.4rem;}
.prog-track{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* STREAK */
.streak-wrap{min-height:36px;display:flex;align-items:center;justify-content:center;margin-bottom:.9rem;}
.streak-badge{display:flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;font-weight:900;font-size:.88rem;padding:.4rem 1.1rem;border-radius:99px;box-shadow:0 3px 0 #b45309;animation:popIn .3s cubic-bezier(.34,1.56,.64,1);font-family:'Fredoka One',cursive;}

/* TOPIC TAG */
.topic-tag{display:inline-block;margin-bottom:.85rem;font-size:.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:.28rem .9rem;border-radius:99px;color:#fff;}
.tg{background:#3b82f6;} .tb{background:#8b5cf6;} .tl{background:#14b8a6;} .tf{background:#f97316;}

/* CARD */
.q-card{background:var(--card);border-radius:22px;padding:1.75rem 1.75rem 1.5rem;box-shadow:var(--shadow);margin-bottom:1rem;position:relative;overflow:hidden;animation:slideIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes slideIn{from{transform:translateX(36px) scale(.97);opacity:0;}to{transform:translateX(0) scale(1);opacity:1;}}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f97316);}
.q-text{font-family:'Fredoka One',cursive;font-size:1.18rem;line-height:1.48;color:var(--text);}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:.65rem;margin-bottom:1rem;}
.opt-btn{display:flex;align-items:center;gap:.9rem;padding:.85rem 1.1rem;background:#fff;border:2.5px solid #e5e7eb;border-radius:14px;cursor:pointer;text-align:left;font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:700;color:var(--text);box-shadow:0 3px 0 #e5e7eb;transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;}
.opt-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #d1d5db;border-color:#c4b5fd;background:#faf5ff;}
.opt-btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #d1d5db;}
.opt-badge{width:30px;height:30px;min-width:30px;border-radius:9px;background:#f3f4f6;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:.82rem;color:var(--muted);transition:all .12s;}
.opt-btn:hover:not(:disabled) .opt-badge{background:#ede9fe;border-color:#8b5cf6;color:#8b5cf6;}
.opt-btn.correct{border-color:var(--green);background:var(--green-l);box-shadow:0 3px 0 #86efac;cursor:default;animation:wiggle .4s ease;}
@keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-1.5deg);}75%{transform:rotate(1.5deg);}}
.opt-btn.correct .opt-badge{background:var(--green);border-color:var(--green);color:#fff;}
.opt-btn.wrong{border-color:var(--red);background:var(--red-l);box-shadow:0 3px 0 #fca5a5;cursor:default;animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.opt-btn.wrong .opt-badge{background:var(--red);border-color:var(--red);color:#fff;}
.opt-btn.reveal{border-color:var(--green);background:var(--green-l);box-shadow:0 3px 0 #86efac;cursor:default;}
.opt-btn.reveal .opt-badge{background:var(--green);border-color:var(--green);color:#fff;}
.opt-btn:disabled{cursor:default;}

/* FEEDBACK */
.fb-box{display:none;border-radius:14px;padding:.95rem 1.1rem;font-size:.9rem;font-weight:600;line-height:1.55;margin-bottom:1rem;animation:popIn .3s cubic-bezier(.34,1.56,.64,1);}
.fb-box.show{display:flex;gap:.7rem;align-items:flex-start;}
.fb-icon{font-size:1.4rem;line-height:1;flex-shrink:0;}
.fb-box strong{display:block;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;}
.fb-box.ok{background:var(--green-l);border:2px solid #86efac;color:#166534;}
.fb-box.ok strong{color:#15803d;}
.fb-box.bad{background:var(--red-l);border:2px solid #fca5a5;color:#991b1b;}
.fb-box.bad strong{color:#b91c1c;}

/* NEXT BTN */
.next-btn{display:none;width:100%;padding:.95rem;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;border-radius:14px;font-family:'Fredoka One',cursive;font-size:1.05rem;letter-spacing:.03em;cursor:pointer;box-shadow:0 4px 0 #7c3aed;transition:transform .12s,box-shadow .12s;margin-bottom:.4rem;}
.next-btn.show{display:block;}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #7c3aed;}
.next-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7c3aed;}

/* CONFETTI */
.conf-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;overflow:hidden;}
.cp{position:absolute;top:-20px;animation:cfFall linear forwards;}
@keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* SCORE SCREEN */
.score-screen{display:none;text-align:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
.trophy{font-size:5rem;display:block;animation:trophyPop .6s cubic-bezier(.34,1.56,.64,1) .2s both;}
@keyframes trophyPop{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0);}}
.end-title{font-family:'Fredoka One',cursive;font-size:2.2rem;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:.5rem 0 .3rem;}
.end-sub{color:var(--muted);font-size:.92rem;font-weight:700;margin-bottom:1.4rem;}
.score-big{position:relative;background:#fff;border-radius:22px;padding:1.4rem;margin-bottom:1.1rem;}
.score-big::before{content:'';position:absolute;inset:-3px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f97316);border-radius:24px;z-index:-1;}
.score-pct{font-family:'Fredoka One',cursive;font-size:4rem;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.score-frac{font-size:.95rem;font-weight:800;color:var(--muted);margin-top:.2rem;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.1rem;}
.res-box{background:#fff;border-radius:14px;padding:.9rem .75rem;box-shadow:0 3px 0 #e5e7eb;border:2px solid #e5e7eb;}
.rval{font-family:'Fredoka One',cursive;font-size:1.75rem;}
.rlbl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.r-c .rval{color:var(--green);} .r-w .rval{color:var(--red);} .r-p .rval{color:#8b5cf6;}
.res-msg{background:#fff;border-radius:14px;padding:.95rem 1.2rem;margin-bottom:1.2rem;box-shadow:0 3px 0 #e5e7eb;border:2px solid #e5e7eb;font-weight:700;font-size:.93rem;line-height:1.55;}
.restart-btn{width:100%;padding:.95rem;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;border:none;border-radius:14px;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 #c2410c;transition:transform .12s,box-shadow .12s;}
.restart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c2410c;}
.restart-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c2410c;}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="conf-wrap" id="cw"></div>
<div class="wrap">

<div class="hdr" id="hdr">
  <span class="hdr-emoji">🏫</span>
  <h1>Grade 8 EMS Quiz</h1>
  <p>South Africa &middot; Government &middot; Budget &middot; Standard of Living &middot; Factors of Production</p>
</div>

<!-- QUIZ -->
<div id="quiz-area">
  <div class="stats">
    <div class="spill sc"><div class="sdot"></div><span id="lpct">0%</span></div>
    <div class="spill co"><div class="sdot"></div><span id="lco">0 correct</span></div>
    <div class="spill wr"><div class="sdot"></div><span id="lwr">0 wrong</span></div>
  </div>
  <div class="prog-area">
    <div class="prog-lbl"><span id="qlbl">Question 1 of 60</span><span id="qpct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  </div>
  <div class="streak-wrap" id="strk"></div>
  <div id="ttag"></div>
  <div class="q-card" id="qcard"><div class="q-text" id="qtxt"></div></div>
  <div class="options" id="opts"></div>
  <div class="fb-box" id="fb"></div>
  <button class="next-btn" id="nxt">Next question ➜</button>
</div>

<!-- SCORE -->
<div class="score-screen" id="ss">
  <span class="trophy" id="troph">🏆</span>
  <div class="end-title" id="etitle">Amazing!</div>
  <div class="end-sub">Quiz complete!</div>
  <div class="score-big"><div class="score-pct" id="epct">0%</div><div class="score-frac" id="efrac">0/0</div></div>
  <div class="res-grid">
    <div class="res-box r-c"><div class="rval" id="eco">0</div><div class="rlbl">Correct</div></div>
    <div class="res-box r-w"><div class="rval" id="ewr">0</div><div class="rlbl">Wrong</div></div>
    <div class="res-box r-p"><div class="rval" id="epct2">0%</div><div class="rlbl">Score</div></div>
  </div>
  <div class="res-msg" id="emsg"></div>
  <button class="restart-btn" onclick="restart()">🔄 Play Again!</button>
</div>

</div><!-- /wrap -->
<script>
const TCOL={gov:'tg',budget:'tb',living:'tl',factors:'tf'};
const TLBL={gov:'🏛️ Government',budget:'💰 National Budget',living:'🏡 Standard of Living',factors:'⚙️ Factors of Production'};
const LTRS=['A','B','C','D'];
const CC=['#8b5cf6','#ec4899','#f97316','#22c55e','#3b82f6','#fbbf24','#14b8a6'];

const Q=[
  {t:'gov',q:"What is the main role of the South African government?",o:["To run all businesses in the country","To govern the country, make laws, and provide services to citizens","To manage only the military","To control all banks"],a:1,e:"The government's main role is to govern the country, create laws, and provide essential services like healthcare, education, and infrastructure to all citizens."},
  {t:'gov',q:"South Africa has THREE spheres of government. Which is NOT one of them?",o:["National government","Provincial government","International government","Local government"],a:2,e:"South Africa's three spheres are: National, Provincial, and Local government. 'International government' does not exist as a South African sphere."},
  {t:'gov',q:"Which sphere of government is responsible for the WHOLE country?",o:["Local government","Municipal government","National government","Provincial government"],a:2,e:"National government is responsible for the entire country — it makes national laws and runs major departments like education, health, and defence."},
  {t:'gov',q:"What is the role of LOCAL government (municipalities)?",o:["Making national laws","Providing community services like water, electricity, and refuse removal","Managing national hospitals","Declaring war on other countries"],a:1,e:"Local government provides services at community level — water supply, electricity, refuse removal, local roads, and parks."},
  {t:'gov',q:"What is Parliament's MAIN function in South Africa?",o:["Running state-owned companies","Making and passing laws for the country","Managing the police service","Collecting taxes directly from citizens"],a:1,e:"Parliament is South Africa's law-making body — it debates, amends, and passes legislation that governs how the country operates."},
  {t:'gov',q:"Which of the following is a public good provided by the government?",o:["Private school fees","A branded clothing store","Public roads and highways","A private hospital"],a:2,e:"Public roads are a public good — provided by the government and available to all citizens, paid for through taxes."},
  {t:'gov',q:"The government collects money from citizens MAINLY through:",o:["Charging entrance fees to national parks","Selling government vehicles","Taxes","Renting out government buildings"],a:2,e:"Taxes are the primary source of government revenue — income tax, VAT, company tax, and customs duties."},
  {t:'gov',q:"What does VAT stand for?",o:["Variable Asset Tax","Value-Added Tax","Voluntary Annual Tax","Vehicle and Asset Tax"],a:1,e:"VAT = Value-Added Tax. In South Africa it is currently 15% and is charged on most goods and services sold."},
  {t:'gov',q:"Which body is responsible for collecting taxes in South Africa?",o:["The Reserve Bank","SASSA","SARS — South African Revenue Service","The Department of Education"],a:2,e:"SARS (South African Revenue Service) collects taxes and customs duties on behalf of the South African government."},
  {t:'gov',q:"What is a 'public sector' entity?",o:["A business owned by private shareholders","An organisation owned and run by the government","A non-profit charity","A private business partnership"],a:1,e:"The public sector consists of organisations owned and managed by the government — public schools, public hospitals, and municipalities are examples."},
  {t:'gov',q:"Which department is responsible for basic education in South Africa?",o:["Department of Health","Department of Basic Education","Department of Finance","Department of Trade, Industry and Competition"],a:1,e:"The Department of Basic Education oversees primary and secondary schooling across South Africa."},
  {t:'gov',q:"What is a SASSA social grant?",o:["A bank loan for business","Money given by the government to eligible citizens who need financial support","A prize won in a government competition","A business licence fee"],a:1,e:"Social grants are payments by SASSA (South African Social Security Agency) to eligible citizens — like the child support grant, disability grant, and old age grant."},
  {t:'gov',q:"What does the South African Reserve Bank (SARB) do?",o:["Provides social grants","Builds national roads","Controls the money supply and interest rates to keep inflation stable","Collects income tax"],a:2,e:"The SARB is South Africa's central bank. It manages monetary policy, controls the money supply, and tries to keep inflation between 3% and 6%."},
  {t:'gov',q:"What is INFLATION in simple terms?",o:["When prices fall over time","When the government reduces taxes","The general rise in prices over time, reducing money's buying power","When the economy grows quickly"],a:2,e:"Inflation is when prices generally rise — meaning your money buys less than before. The SARB targets 3–6% inflation in South Africa."},
  {t:'gov',q:"What is the difference between the public and private sectors?",o:["Public sector runs for profit; private sector is run by government","Public sector is owned by government; private sector is owned by private individuals or companies","They are exactly the same","The private sector is non-profit"],a:1,e:"Public sector = government owned and managed. Private sector = privately owned businesses operating primarily for profit."},

  // BUDGET
  {t:'budget',q:"What is the National Budget?",o:["A list of prices set by government","The government's annual plan showing how it will earn and spend money","A statement of each citizen's tax obligation","A record of last year's government spending"],a:1,e:"The National Budget is the government's annual financial plan — showing expected revenue (income) and planned expenditure (spending) for the year ahead."},
  {t:'budget',q:"Who presents the National Budget in South Africa each year?",o:["The President","The Minister of Finance","The Reserve Bank Governor","The Speaker of Parliament"],a:1,e:"The Minister of Finance presents the Budget Speech in Parliament, usually in February each year."},
  {t:'budget',q:"What is 'government REVENUE'?",o:["Money the government spends on services","All the money the government RECEIVES, mainly through taxes","Money borrowed from foreign countries","Salaries paid to government workers"],a:1,e:"Government revenue is all income flowing INTO the government — primarily from taxes (income tax, VAT, company tax, customs duties)."},
  {t:'budget',q:"What is 'government EXPENDITURE'?",o:["Money the government receives from taxes","Money the government SPENDS on services for citizens","Profit made by state companies","Savings in government's bank account"],a:1,e:"Government expenditure is all money going OUT — spent on education, healthcare, social grants, infrastructure, policing, and defence."},
  {t:'budget',q:"When the government spends MORE than it receives, this is called a:",o:["Budget surplus","Balanced budget","Budget deficit","Tax refund"],a:2,e:"A budget deficit = expenditure > revenue. The government is spending more than it earns. South Africa frequently runs a budget deficit."},
  {t:'budget',q:"When the government earns MORE than it spends, this is called a:",o:["Budget deficit","Balanced budget","Budget surplus","Government overdraft"],a:2,e:"A budget surplus = revenue > expenditure. The government earns more than it spends. This is the ideal but rarely achieved situation."},
  {t:'budget',q:"When government revenue EQUALS expenditure, this is called a:",o:["Budget deficit","Balanced budget","Budget surplus","Zero-based budget"],a:1,e:"A balanced budget means income equals spending — there is neither a deficit nor a surplus. Revenue = Expenditure."},
  {t:'budget',q:"If the government has a budget DEFICIT, it must:",o:["Cut all employee salaries by 50%","Borrow money or raise taxes to cover the shortfall","Stop all services immediately","Print unlimited money"],a:1,e:"A deficit must be funded — the government borrows money (adding to national debt) or increases taxes to cover the gap."},
  {t:'budget',q:"What is 'national DEBT'?",o:["The total amount citizens owe to banks","The total amount the government owes from borrowing over time","Money stolen from the government","Unpaid taxes"],a:1,e:"National debt is the total accumulated borrowings of the government. South Africa's national debt is very high and rising, which is a major economic concern."},
  {t:'budget',q:"Which sector typically receives one of the LARGEST shares of South Africa's national budget?",o:["Defence","Sports and recreation","Education","Tourism"],a:2,e:"Education consistently receives one of the largest budget allocations in South Africa — investing in human capital is central to fighting poverty and inequality."},
  {t:'budget',q:"What does the government DO with tax money collected from citizens?",o:["Saves it all in foreign banks","Funds services like schools, hospitals, roads, and social grants","Distributes equal amounts to every citizen","Uses it only for military"],a:1,e:"Tax revenue is used to provide public services — education, healthcare, social grants, police, infrastructure, and government administration."},
  {t:'budget',q:"Why do governments sometimes BORROW money?",o:["Because they prefer debt to saving","To fund spending when tax revenue is not enough to cover all planned expenditure","To give money to foreign countries","To pay double salaries"],a:1,e:"Governments borrow when expenditure exceeds revenue. Borrowed funds cover the deficit and finance essential services or large infrastructure projects."},
  {t:'budget',q:"What is 'personal income tax'?",o:["A tax on company profits","A tax individuals pay based on how much they earn","A tax on imported goods","A flat fee every citizen pays"],a:1,e:"Personal income tax is levied on individuals' earnings. South Africa uses a progressive tax system — the more you earn, the higher your tax rate."},
  {t:'budget',q:"What does 'progressive tax' mean?",o:["Everyone pays the same flat tax","Tax decreases as income rises","Tax rate increases as income rises — higher earners pay a larger percentage","Tax only applies to companies"],a:2,e:"Progressive tax means the rich pay a higher percentage of their income in tax. This aims to reduce inequality and fund services for the poor."},
  {t:'budget',q:"Which of the following is government EXPENDITURE (not revenue)?",o:["Personal income tax","VAT collected from consumers","Social grants paid out to citizens","Customs duties on imported goods"],a:2,e:"Social grants are money going OUT of government (expenditure). Taxes (income tax, VAT, customs duties) are money coming IN (revenue)."},

  // STANDARD OF LIVING
  {t:'living',q:"What does 'standard of living' mean?",o:["How tall city buildings are","The level of wealth, comfort, and access to goods and services available to people","How many people live in a country","The average age in a country"],a:1,e:"Standard of living refers to the quality of material life — income level, access to goods and services, housing, healthcare, and education available to people."},
  {t:'living',q:"Which would IMPROVE someone's standard of living?",o:["Losing their job","Getting a higher salary and affording better housing and healthcare","Prices of all goods doubling","Schools closing in their area"],a:1,e:"Higher income means more access to goods, services, healthcare, and education — directly improving standard of living."},
  {t:'living',q:"What is the difference between NEEDS and WANTS?",o:["They mean the same thing","Needs are essential for survival; wants are things we desire but can live without","Wants are more important than needs","Needs include luxury cars and holidays"],a:1,e:"Needs = basics for survival (food, water, shelter, clothing, healthcare). Wants = extras that make life more comfortable but aren't essential (new phone, luxury car)."},
  {t:'living',q:"Which of the following is a BASIC NEED?",o:["A holiday abroad","A new smartphone","Clean drinking water","A luxury sports car"],a:2,e:"Clean drinking water is a basic need — without it, people cannot survive. Holidays, phones, and luxury cars are wants."},
  {t:'living',q:"What does the Human Development Index (HDI) measure?",o:["The size of a country's army","Human development using income, health (life expectancy), and education","The number of businesses in a country","A country's geographic size"],a:1,e:"The HDI is a composite index measuring: GDP per capita (income), life expectancy (health), and years of schooling (education). Higher HDI = more developed country."},
  {t:'living',q:"Which factor REDUCES standard of living?",o:["Free quality education for all","High unemployment rates","Affordable healthcare","A growing economy"],a:1,e:"High unemployment reduces income for many families, cutting access to food, housing, education, and healthcare — lowering standard of living significantly."},
  {t:'living',q:"What is 'GDP per capita'?",o:["The total population of a country","Total GDP divided by population — a rough measure of average income per person","The total number of businesses","Government's total annual spending"],a:1,e:"GDP per capita = GDP ÷ Population. It indicates the average economic output (and roughly the average income) per person in a country."},
  {t:'living',q:"South Africa's extreme inequality is often measured using the:",o:["GDP index","Gini coefficient","Unemployment rate only","Trade balance"],a:1,e:"The Gini coefficient measures income inequality (0 = perfect equality; 1 = extreme inequality). South Africa has one of the highest Gini coefficients in the world."},
  {t:'living',q:"Which factor MOST directly improves standard of living?",o:["The colour of government buildings","Access to quality education, healthcare, and employment","The number of political parties","How many TV channels are available"],a:1,e:"Education, healthcare, and employment are the core drivers — they determine income, health outcomes, and life opportunities for people."},
  {t:'living',q:"What is POVERTY in an economic sense?",o:["Spending more than you earn","A state where a person lacks sufficient income or resources to meet basic needs","When a government runs a deficit","When businesses make losses"],a:1,e:"Poverty means not having enough income or resources to meet basic needs like food, shelter, clean water, clothing, and healthcare."},
  {t:'living',q:"How does EDUCATION improve standard of living?",o:["Education has no effect on income","Education gives skills for better jobs — increasing income and quality of life","Education only benefits government","Education reduces the number of workers available"],a:1,e:"Education builds human capital. Educated people access better jobs with higher incomes — improving their standard of living and contributing to national economic growth."},
  {t:'living',q:"What is meant by 'quality of life'?",o:["How much money someone has","Overall wellbeing — including health, happiness, safety, and access to opportunities, not just income","How many luxury items someone owns","How productive a country's workers are"],a:1,e:"Quality of life is broader than standard of living — it includes health, happiness, safety, relationships, freedom, and life satisfaction, not just material wealth."},
  {t:'living',q:"How does UNEMPLOYMENT affect standard of living?",o:["It always improves living standards","It reduces income, increases poverty, and lowers access to goods and services","It only affects businesses","Unemployed people maintain the same standard of living"],a:1,e:"Unemployment means no income — making it impossible to afford food, housing, education, and healthcare. It directly and severely lowers standard of living."},
  {t:'living',q:"What is 'subsistence living'?",o:["Living in a luxury home","Living at a level where you can just barely meet basic needs with nothing left over","Living without any needs","Earning more than you spend"],a:1,e:"Subsistence living means surviving at a minimum level — producing or earning just enough for basic needs, with no surplus for savings or extras."},
  {t:'living',q:"Which South African government programme directly helps improve the standard of living of poor children?",o:["The JSE stock exchange","The child support grant from SASSA","The SARB repo rate","The national budget speech"],a:1,e:"The child support grant is paid by SASSA to poor caregivers to help cover the costs of raising children — directly improving their standard of living."},

  // FACTORS OF PRODUCTION
  {t:'factors',q:"What are 'factors of production'?",o:["The goods and services a business sells","The resources used to produce goods and services in an economy","The government's business regulations","A company's advertising strategies"],a:1,e:"Factors of production are the inputs used to create goods and services. They are grouped into four: Land, Labour, Capital, and Entrepreneurship."},
  {t:'factors',q:"How many factors of production are there?",o:["Two","Three","Four","Five"],a:2,e:"There are FOUR factors of production: Land (natural resources), Labour (human effort), Capital (man-made tools and machinery), and Entrepreneurship (organising the other three)."},
  {t:'factors',q:"In economics, 'LAND' as a factor of production includes:",o:["Only farms and agricultural fields","ALL natural resources — land, water, minerals, forests, and gifts of nature","Only the buildings a business uses","Only the machinery in a factory"],a:1,e:"'Land' in economics means ALL natural resources — farmland, minerals (gold, coal, diamonds), water sources, forests, fish, and everything provided by nature."},
  {t:'factors',q:"What is the REWARD paid for the factor LAND?",o:["Wages","Interest","Rent","Profit"],a:2,e:"The reward for Land is RENT — payment to the owner of natural resources for allowing their use in production."},
  {t:'factors',q:"What does 'LABOUR' as a factor of production mean?",o:["All machines used in production","Physical and mental effort of human beings used to produce goods and services","The land and buildings of a factory","Raw materials used in manufacturing"],a:1,e:"Labour = all human effort in production. This includes physical work (factory worker, builder) and mental work (accountant, designer, teacher)."},
  {t:'factors',q:"What is the REWARD (payment) for the factor LABOUR?",o:["Rent","Interest","Profit","Wages or salary"],a:3,e:"The reward for Labour is WAGES (hourly/daily workers) or SALARY (monthly earners). This is the payment for their human effort in production."},
  {t:'factors',q:"In economics, 'CAPITAL' as a factor of production means:",o:["Money in a bank account","Man-made resources used in production — machinery, tools, buildings, and equipment","Natural resources like minerals","The hard work of employees"],a:1,e:"Capital (as a factor of production) = man-made (manufactured) assets used in production — factories, machinery, computers, trucks, and tools. NOT money itself!"},
  {t:'factors',q:"What is the REWARD paid for the factor CAPITAL?",o:["Wages","Rent","Profit","Interest"],a:3,e:"The reward for Capital is INTEREST — the return earned by those who supply capital (whether money invested or equipment provided)."},
  {t:'factors',q:"What is an ENTREPRENEUR?",o:["A government official who makes laws","A person who combines factors of production to start and run a business, taking financial risk","A worker who earns a fixed monthly salary","A machine used in manufacturing"],a:1,e:"An entrepreneur organises Land, Labour, and Capital to create a business. They bear the financial risk and, if successful, earn profit as their reward."},
  {t:'factors',q:"What is the REWARD for ENTREPRENEURSHIP?",o:["Wages","Rent","Profit (or loss)","Interest"],a:2,e:"The reward for entrepreneurship is PROFIT — what remains after all costs are paid. But entrepreneurs also risk making a LOSS if the business fails."},
  {t:'factors',q:"South Africa is MOST naturally rich in which factor of production?",o:["Entrepreneurship","Imported capital machinery","Land — particularly mineral resources like gold, platinum, diamonds, and coal","Large numbers of skilled, qualified workers"],a:2,e:"South Africa is globally significant in Land resources — it is one of the world's top producers of gold, platinum, chromium, manganese, diamonds, and coal."},
  {t:'factors',q:"What is 'HUMAN CAPITAL'?",o:["Machines owned by humans","The skills, knowledge, and education of a country's workforce","Simply the number of workers in a country","Physical labour done in factories"],a:1,e:"Human capital is the value of workers' skills, education, training, and experience. Better human capital = more productive Labour factor = stronger economy."},
  {t:'factors',q:"Which combination CORRECTLY matches each factor to its reward?",o:["Land=Wages, Labour=Rent, Capital=Profit, Entrepreneurship=Interest","Land=Rent, Labour=Wages, Capital=Interest, Entrepreneurship=Profit","Land=Profit, Labour=Interest, Capital=Rent, Entrepreneurship=Wages","Land=Interest, Labour=Profit, Capital=Wages, Entrepreneurship=Rent"],a:1,e:"The correct match: Land → Rent | Labour → Wages/Salary | Capital → Interest | Entrepreneurship → Profit. This is a very popular exam question — memorise it!"},
  {t:'factors',q:"Why is ENTREPRENEURSHIP considered a vital factor of production?",o:["Entrepreneurs never fail so they are guaranteed to help the economy","Entrepreneurs create businesses, generate jobs, bring innovation, and drive economic growth","Entrepreneurs replace government in providing services","Entrepreneurs always work for free"],a:1,e:"Entrepreneurs are economic engines — they combine the other factors to create businesses, create employment, introduce new products, and grow the economy."},
  {t:'factors',q:"A farmer uses farmland, workers, and tractors, and organises everything herself. What factor of production does SHE personally represent?",o:["Land","Labour","Capital","Entrepreneurship"],a:3,e:"She organises all other factors, makes decisions, and bears the risk = Entrepreneur. The farmland = Land. The workers = Labour. The tractors = Capital."},
  {t:'factors',q:"South Africa struggles with the QUALITY of its Labour factor. What is the MAIN reason?",o:["Too many people want to work","Poor education outcomes and limited skills training leave many workers without qualifications businesses need","Too few natural resources","Businesses only want to use machines"],a:1,e:"Inadequate schooling and vocational training mean many South Africans lack the skills employers need — reducing labour quality and contributing to high unemployment."},
];

let ord=[],cur=0,sc=0,wr=0,strk=0,ans=false;

function shuf(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function restart(){
  ord=shuf([...Array(Q.length).keys()]);
  cur=0;sc=0;wr=0;strk=0;ans=false;
  document.getElementById('ss').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('hdr').style.display='block';
  updStats();render();
}

function updStats(){
  const d=cur===0?0:Math.round(sc/cur*100);
  document.getElementById('lpct').textContent=(cur===0?'0':d)+'%';
  document.getElementById('lco').textContent=sc+' correct';
  document.getElementById('lwr').textContent=wr+' wrong';
}

function render(){
  const qi=ord[cur],q=Q[qi],tot=Q.length,pp=Math.round(cur/tot*100);
  document.getElementById('pfill').style.width=pp+'%';
  document.getElementById('qlbl').textContent='Question '+(cur+1)+' of '+tot;
  document.getElementById('qpct').textContent=pp+'%';
  document.getElementById('ttag').innerHTML=`<span class="topic-tag ${TCOL[q.t]}">${TLBL[q.t]}</span>`;
  const sb=document.getElementById('strk');
  if(strk>=3){const f=strk>=7?'🔥🔥🔥':strk>=5?'🔥🔥':'🔥';sb.innerHTML=`<div class="streak-badge">${f} ${strk} streak!</div>`;}
  else sb.innerHTML='';
  document.getElementById('qtxt').textContent=q.q;
  const shOpts=shuf(q.o.map((text,oi)=>({text,oi})));
  const optsEl=document.getElementById('opts');optsEl.innerHTML='';
  shOpts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.innerHTML=`<span class="opt-badge">${LTRS[i]}</span><span>${opt.text}</span>`;
    b.onclick=()=>doAns(b,opt.oi,q.a,shOpts,q.e);
    optsEl.appendChild(b);
  });
  document.getElementById('fb').className='fb-box';
  document.getElementById('fb').innerHTML='';
  document.getElementById('nxt').className='next-btn';
  ans=false;
  const c=document.getElementById('qcard');c.style.animation='none';void c.offsetWidth;c.style.animation='';
}

function doAns(btn,chosen,correct,shOpts,exp){
  if(ans)return;ans=true;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  if(chosen===correct){
    btn.classList.add('correct');sc++;strk++;confetti(14);
    fb.className='fb-box ok show';
    fb.innerHTML=`<span class="fb-icon">🎉</span><div><strong>Correct!</strong>${exp}</div>`;
  } else {
    btn.classList.add('wrong');wr++;strk=0;
    document.querySelectorAll('.opt-btn').forEach(b=>{
      const txt=b.querySelector('span:last-child').textContent;
      const f=shOpts.find(o=>o.text===txt);
      if(f&&f.oi===correct)b.classList.add('reveal');
    });
    fb.className='fb-box bad show';
    fb.innerHTML=`<span class="fb-icon">😬</span><div><strong>Not quite!</strong>${exp}</div>`;
  }
  updStats();
  document.getElementById('nxt').className='next-btn show';
}

document.getElementById('nxt').onclick=function(){cur++;cur>=Q.length?showScore():render();};

function showScore(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('hdr').style.display='none';
  const ss=document.getElementById('ss');ss.style.display='block';
  const tot=Q.length,pct=Math.round(sc/tot*100);
  document.getElementById('epct').textContent=pct+'%';
  document.getElementById('epct2').textContent=pct+'%';
  document.getElementById('efrac').textContent=sc+' / '+tot;
  document.getElementById('eco').textContent=sc;
  document.getElementById('ewr').textContent=wr;
  let tr,ttl,msg;
  if(pct>=90){tr='🏆';ttl='Legend Status!';msg='WOW! You absolutely crushed it! You know your Grade 8 EMS inside out. Your teacher would be SO proud! 🌟';}
  else if(pct>=75){tr='🥇';ttl='Brilliant Work!';msg="That's a fantastic score! You have a strong understanding of these topics. Review the ones you missed and you'll be unstoppable! 💪";}
  else if(pct>=60){tr='🥈';ttl='Good Effort!';msg="You're getting there! You know quite a lot — now focus on the questions you got wrong and revise those sections. You've got this! 📚";}
  else if(pct>=50){tr='🥉';ttl='Keep Going!';msg="Half-way there! Don't give up — every wrong answer is a lesson learned. Revise your notes and try again! 🔄";}
  else{tr='💡';ttl='More Practice Needed!';msg="Don't stress — every expert started as a beginner! Go back to your textbook, revise carefully, and come back stronger. You CAN do this! 📖";}
  document.getElementById('troph').textContent=tr;
  document.getElementById('etitle').textContent=ttl;
  document.getElementById('emsg').textContent=msg;
  confetti(pct>=60?45:0);
}

function confetti(n){
  const w=document.getElementById('cw');
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='cp';
    const c=CC[Math.floor(Math.random()*CC.length)];
    const l=Math.random()*100,delay=Math.random()*.9,dur=1.5+Math.random()*1.5,sz=7+Math.random()*9,rot=Math.random()*360;
    el.style.cssText=`left:${l}%;background:${c};width:${sz}px;height:${sz}px;animation-duration:${dur}s;animation-delay:${delay}s;transform:rotate(${rot}deg);border-radius:${Math.random()>.5?'50%':'3px'}`;
    w.appendChild(el);
    setTimeout(()=>el.remove(),(dur+delay+.6)*1000);
  }
}

restart();
</script>
