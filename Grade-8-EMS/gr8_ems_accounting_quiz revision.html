<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 EMS — Accounting Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff9f0;--ink:#1a1025;--card:#fff;
  --yellow:#ffdd00;--orange:#ff6b2b;--pink:#ff3d7f;
  --teal:#00c9b1;--blue:#3d5afe;--green:#00c853;
  --red:#ff1744;--purple:#aa00ff;
  --green-l:#e8faf0;--red-l:#fff0f0;--muted:#7a6e8a;
}
body{background:var(--bg);background-image:radial-gradient(circle,#ffdd0022 1px,transparent 1px),radial-gradient(circle,#ff6b2b11 1px,transparent 1px);background-size:28px 28px,56px 56px;background-position:0 0,14px 14px;min-height:100vh;font-family:'Nunito',sans-serif;color:var(--ink);padding:1.5rem 1rem 4rem;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:650px;}
/* HEADER */
.hdr{text-align:center;margin-bottom:1.8rem;animation:dropIn .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes dropIn{from{transform:translateY(-30px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.hdr-badge{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:.25rem .9rem;font-family:'Righteous',cursive;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink);margin-bottom:.6rem;}
.hdr h1{font-family:'Righteous',cursive;font-size:2.1rem;line-height:1.1;text-shadow:3px 3px 0 var(--orange);color:var(--ink);}
.hdr h1 span{color:var(--orange);}
.hdr p{font-size:.82rem;color:var(--muted);font-weight:700;margin-top:.4rem;letter-spacing:.04em;}
/* STATS */
.stats{display:flex;gap:.6rem;justify-content:center;margin-bottom:1.3rem;flex-wrap:wrap;}
.sc2{display:flex;align-items:center;gap:.4rem;padding:.38rem .9rem;border:2.5px solid var(--ink);border-radius:99px;font-weight:900;font-size:.78rem;background:#fff;box-shadow:2px 2px 0 var(--ink);letter-spacing:.03em;}
.sc2.sv{color:var(--blue);} .sc2.co{color:var(--green);} .sc2.wr{color:var(--red);}
.sdot{width:8px;height:8px;border-radius:50%;}
.sc2.sv .sdot{background:var(--blue);} .sc2.co .sdot{background:var(--green);} .sc2.wr .sdot{background:var(--red);}
/* PROGRESS */
.prog-area{margin-bottom:1rem;}
.prog-lbl{display:flex;justify-content:space-between;font-size:.76rem;font-weight:800;color:var(--muted);margin-bottom:.4rem;letter-spacing:.04em;}
.prog-track{height:12px;background:#e8e0f0;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;box-shadow:2px 2px 0 var(--ink);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--pink));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
/* STREAK */
.streak-wrap{min-height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:.8rem;}
.streak-badge{display:flex;align-items:center;gap:.4rem;background:var(--yellow);border:2.5px solid var(--ink);border-radius:99px;padding:.38rem 1.1rem;font-family:'Righteous',cursive;font-size:.9rem;box-shadow:3px 3px 0 var(--ink);animation:popIn .3s cubic-bezier(.34,1.56,.64,1);letter-spacing:.03em;}
@keyframes popIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
/* TOPIC TAG */
.topic-tag{display:inline-block;margin-bottom:.8rem;font-family:'Righteous',cursive;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:.28rem 1rem;border-radius:99px;border:2.5px solid var(--ink);color:#fff;box-shadow:2px 2px 0 var(--ink);}
.tc{background:var(--teal);} .td{background:var(--blue);} .ts{background:var(--purple);} .tj{background:var(--orange);}
/* CARD */
.q-card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:1.7rem 1.8rem 1.5rem;box-shadow:5px 5px 0 var(--ink);margin-bottom:1rem;position:relative;animation:slideIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes slideIn{from{transform:translateX(40px) rotate(1deg);opacity:0;}to{transform:translateX(0) rotate(0);opacity:1;}}
.q-card::before{content:'';position:absolute;top:-3px;left:1.5rem;right:1.5rem;height:5px;background:repeating-linear-gradient(90deg,var(--yellow) 0,var(--yellow) 10px,transparent 10px,transparent 16px);border-radius:99px;}
.q-num{font-family:'Righteous',cursive;font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.6rem;}
.q-text{font-family:'Righteous',cursive;font-size:1.15rem;line-height:1.5;color:var(--ink);}
/* OPTIONS */
.options{display:flex;flex-direction:column;gap:.65rem;margin-bottom:1rem;}
.opt-btn{display:flex;align-items:flex-start;gap:.85rem;padding:.85rem 1.1rem;background:#fff;border:2.5px solid var(--ink);border-radius:13px;cursor:pointer;text-align:left;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;}
.opt-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--yellow);}
.opt-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.opt-letter{width:28px;height:28px;min-width:28px;border-radius:8px;background:#f0eaf8;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Righteous',cursive;font-size:.8rem;color:var(--muted);transition:all .1s;flex-shrink:0;margin-top:1px;}
.opt-btn:hover:not(:disabled) .opt-letter{background:var(--ink);color:#fff;}
.opt-btn.correct{border-color:var(--green);background:var(--green-l);box-shadow:3px 3px 0 var(--green);cursor:default;animation:wobble .45s ease;}
@keyframes wobble{0%,100%{transform:rotate(0);}20%{transform:rotate(-2deg);}40%{transform:rotate(2deg);}60%{transform:rotate(-1.5deg);}80%{transform:rotate(1.5deg);}}
.opt-btn.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff;}
.opt-btn.wrong{border-color:var(--red);background:var(--red-l);box-shadow:3px 3px 0 var(--red);cursor:default;animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.opt-btn.wrong .opt-letter{background:var(--red);border-color:var(--red);color:#fff;}
.opt-btn.reveal{border-color:var(--green);background:var(--green-l);box-shadow:3px 3px 0 var(--green);cursor:default;}
.opt-btn.reveal .opt-letter{background:var(--green);border-color:var(--green);color:#fff;}
.opt-btn:disabled{cursor:default;}
/* FEEDBACK */
.fb-box{display:none;border:2.5px solid var(--ink);border-radius:13px;padding:.9rem 1.1rem;font-size:.88rem;font-weight:700;line-height:1.6;margin-bottom:1rem;animation:popIn .3s cubic-bezier(.34,1.56,.64,1);}
.fb-box.show{display:flex;gap:.7rem;align-items:flex-start;}
.fb-icon{font-size:1.5rem;line-height:1;flex-shrink:0;}
.fb-box strong{display:block;font-family:'Righteous',cursive;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
.fb-box.ok{background:#e8faf0;border-color:var(--green);box-shadow:3px 3px 0 var(--green);color:#085032;}
.fb-box.ok strong{color:var(--green);}
.fb-box.bad{background:#fff0f0;border-color:var(--red);box-shadow:3px 3px 0 var(--red);color:#7a0020;}
.fb-box.bad strong{color:var(--red);}
/* NEXT BTN */
.next-btn{display:none;width:100%;padding:.95rem;background:var(--ink);color:var(--yellow);border:3px solid var(--ink);border-radius:13px;font-family:'Righteous',cursive;font-size:1.05rem;letter-spacing:.07em;cursor:pointer;box-shadow:4px 4px 0 var(--orange);transition:transform .1s,box-shadow .1s;margin-bottom:.4rem;}
.next-btn.show{display:block;}
.next-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--orange);}
.next-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--orange);}
/* CONFETTI */
.conf-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;overflow:hidden;}
.cp{position:absolute;top:-20px;animation:cfFall linear forwards;}
@keyframes cfFall{to{transform:translateY(110vh) rotate(900deg);opacity:0;}}
/* SCORE */
.score-screen{display:none;text-align:center;animation:dropIn .5s cubic-bezier(.34,1.56,.64,1);}
.trophy-wrap{width:100px;height:100px;display:flex;align-items:center;justify-content:center;background:var(--yellow);border:3px solid var(--ink);border-radius:50%;font-size:3.2rem;box-shadow:5px 5px 0 var(--ink);margin:0 auto 1.2rem;animation:trophyPop .6s cubic-bezier(.34,1.56,.64,1) .2s both;}
@keyframes trophyPop{from{transform:scale(0) rotate(-25deg);}to{transform:scale(1) rotate(0);}}
.end-title{font-family:'Righteous',cursive;font-size:2.3rem;text-shadow:3px 3px 0 var(--orange);margin-bottom:.3rem;}
.end-sub{font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:1.4rem;}
.score-big{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:1.4rem;box-shadow:5px 5px 0 var(--ink);margin-bottom:1.1rem;position:relative;overflow:hidden;}
.score-big::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--yellow) 0,var(--yellow) 12px,var(--orange) 12px,var(--orange) 24px,var(--pink) 24px,var(--pink) 36px,var(--teal) 36px,var(--teal) 48px);}
.score-pct{font-family:'Righteous',cursive;font-size:4.5rem;color:var(--ink);text-shadow:4px 4px 0 var(--yellow);line-height:1;margin-top:.4rem;}
.score-frac{font-size:1rem;font-weight:800;color:var(--muted);margin-top:.2rem;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.1rem;}
.res-box{background:#fff;border:2.5px solid var(--ink);border-radius:13px;padding:.9rem .75rem;box-shadow:3px 3px 0 var(--ink);}
.rval{font-family:'Righteous',cursive;font-size:1.9rem;}
.rlbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.r-c .rval{color:var(--green);} .r-w .rval{color:var(--red);} .r-p .rval{color:var(--blue);}
.res-msg{background:#fff;border:2.5px solid var(--ink);border-radius:13px;padding:.95rem 1.2rem;margin-bottom:1.2rem;box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:.92rem;line-height:1.55;text-align:left;}
.restart-btn{width:100%;padding:1rem;background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:13px;font-family:'Righteous',cursive;font-size:1.1rem;letter-spacing:.07em;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;}
.restart-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.restart-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
</style>
</head>
<body>
<div class="conf-wrap" id="cw"></div>
<div class="wrap">
<div class="hdr" id="hdr">
  <div class="hdr-badge">Grade 8 EMS · Accounting</div>
  <h1>The <span>Accounting</span> Challenge!</h1>
  <p>Concepts · Source Documents · Accounting Cycle · Cash Receipts Journal · SA CAPS</p>
</div>
<div id="quiz-area">
  <div class="stats">
    <div class="sc2 sv"><div class="sdot"></div><span id="lpct">0%</span></div>
    <div class="sc2 co"><div class="sdot"></div><span id="lco">0 correct</span></div>
    <div class="sc2 wr"><div class="sdot"></div><span id="lwr">0 wrong</span></div>
  </div>
  <div class="prog-area">
    <div class="prog-lbl"><span id="qlbl">Question 1 of 60</span><span id="qpct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
  </div>
  <div class="streak-wrap" id="strk"></div>
  <div id="ttag"></div>
  <div class="q-card" id="qcard">
    <div class="q-num" id="qnum">Q1</div>
    <div class="q-text" id="qtxt"></div>
  </div>
  <div class="options" id="opts"></div>
  <div class="fb-box" id="fb"></div>
  <button class="next-btn" id="nxt">NEXT QUESTION ▶</button>
</div>
<div class="score-screen" id="ss">
  <div class="trophy-wrap"><span id="troph">🏆</span></div>
  <div class="end-title" id="etitle">Brilliant!</div>
  <div class="end-sub">You finished the Accounting Quiz!</div>
  <div class="score-big">
    <div class="score-pct" id="epct">0%</div>
    <div class="score-frac" id="efrac">0 / 0</div>
  </div>
  <div class="res-grid">
    <div class="res-box r-c"><div class="rval" id="eco">0</div><div class="rlbl">Correct</div></div>
    <div class="res-box r-w"><div class="rval" id="ewr">0</div><div class="rlbl">Wrong</div></div>
    <div class="res-box r-p"><div class="rval" id="epct2">0%</div><div class="rlbl">Score</div></div>
  </div>
  <div class="res-msg" id="emsg"></div>
  <button class="restart-btn" onclick="restart()">PLAY AGAIN!</button>
</div>
</div>
<script>
const TCOL={concepts:'tc',docs:'td',cycle:'ts',crj:'tj'};
const TLBL={concepts:'📚 Accounting Concepts',docs:'🧾 Source Documents',cycle:'🔄 Accounting Cycle',crj:'💵 Cash Receipts Journal'};
const LTRS=['A','B','C','D'];
const CC=['#ffdd00','#ff6b2b','#ff3d7f','#00c9b1','#3d5afe','#00c853','#aa00ff'];

const Q=[
  {t:'concepts',q:"What is ACCOUNTING?",o:["The process of buying and selling goods","Recording, classifying, and summarising all financial transactions of a business","A method of managing employees","A way of advertising products"],a:1,e:"Accounting is the process of recording, classifying, summarising, and interpreting all financial transactions so owners and managers can make informed decisions."},
  {t:'concepts',q:"What is the BUSINESS ENTITY concept?",o:["Any organisation that makes profit","The business is treated as separate from its owner for accounting purposes","The physical building where a business operates","The owner's personal bank account"],a:1,e:"Business Entity means the business is treated as SEPARATE from its owner. Personal transactions of the owner must NEVER be mixed with business transactions."},
  {t:'concepts',q:"What does the GOING CONCERN concept assume?",o:["The business is closing down soon","The business will continue to operate indefinitely into the future","The business only operates in the morning","The business makes a profit every month"],a:1,e:"Going Concern assumes the business will continue operating for the foreseeable future. Assets are recorded at cost, not what they would sell for if the business closed."},
  {t:'concepts',q:"What is the HISTORICAL COST concept?",o:["Assets are recorded at current market value","Assets are recorded at the ORIGINAL price paid to acquire them","Assets are valued at what they could be sold for today","Assets are recorded at replacement cost"],a:1,e:"Historical Cost means assets are always recorded at the ORIGINAL purchase price (cost price), even if the market value changes over time."},
  {t:'concepts',q:"What does the MATCHING concept require?",o:["Matching the owner to the business","Recording income in the same period as the expenses incurred to earn that income","Matching the bank balance to the cash book","Making sure debits equal credits"],a:1,e:"The Matching concept requires expenses to be recorded in the SAME period as the income they helped generate. This gives a true picture of profit for that period."},
  {t:'concepts',q:"What does MATERIALITY mean in accounting?",o:["Using material goods in production","Significant items must be disclosed separately; trivial items may be handled simply","Only physical assets are recorded","All transactions must be reported to government"],a:1,e:"Materiality means items significant enough to affect a user's decision must be disclosed separately. Small insignificant items don't need the same treatment as major assets."},
  {t:'concepts',q:"What does the CONSISTENCY concept require?",o:["All employees must work the same hours","The same accounting methods must be applied from one period to the next","All businesses must use the same accounting software","Bank statements must balance every month"],a:1,e:"Consistency means using the SAME accounting methods and rules period after period. This makes comparisons between different years meaningful and reliable."},
  {t:'concepts',q:"What is an ASSET in accounting?",o:["Money owed by the business to others","Something of value OWNED by the business from which future economic benefits are expected","The profit earned by the business","Salaries paid to employees"],a:1,e:"An asset is something of VALUE that a business OWNS or controls — cash, vehicles, equipment, debtors, and inventory are all assets."},
  {t:'concepts',q:"What is a LIABILITY in accounting?",o:["Something the business owns","A debt or obligation that the business OWES to others","The equity of the owner","Income earned by the business"],a:1,e:"A liability is an amount OWED by the business to someone else — bank loans, creditors, and VAT payable are liabilities."},
  {t:'concepts',q:"What is OWNER'S EQUITY (capital)?",o:["Money the government gives the business","The owner's financial interest: capital invested + profits earned – drawings taken","Total sales of the business","Debt owed to suppliers"],a:1,e:"Owner's Equity = Capital invested + Net Profit – Drawings. It represents the owner's share of the business — what would remain if all debts were paid."},
  {t:'concepts',q:"What is the ACCOUNTING EQUATION?",o:["Income = Expenses + Profit","Assets = Liabilities + Owner's Equity","Revenue – Costs = Net Profit","Debit = Credit + Balance"],a:1,e:"Assets = Liabilities + Owner's Equity. This equation ALWAYS balances. Every transaction affects at least two elements and keeps the equation in balance."},
  {t:'concepts',q:"Assets = R80 000 and Liabilities = R30 000. What is the Owner's Equity?",o:["R110 000","R30 000","R50 000","R80 000"],a:2,e:"Assets = Liabilities + Owner's Equity → R80 000 = R30 000 + ? → Owner's Equity = R80 000 – R30 000 = R50 000."},
  {t:'concepts',q:"What are DEBTORS?",o:["People the business OWES money to","People or businesses that OWE money TO the business","The bank where the business has its account","Suppliers of the business"],a:1,e:"Debtors are customers who bought goods on CREDIT — they owe money TO the business. Debtors are recorded as ASSETS because payment is expected."},
  {t:'concepts',q:"What are CREDITORS?",o:["People the business has lent money to","Suppliers to whom the business OWES money","The bank of the business","Customers who paid cash"],a:1,e:"Creditors are suppliers who sold goods to the business on CREDIT — the business owes money TO them. Creditors are LIABILITIES."},
  {t:'concepts',q:"What is INCOME (revenue) in accounting?",o:["Money the owner puts into the business","Money flowing INTO the business from its operations, like sales of goods","Money borrowed from the bank","The value of assets purchased"],a:1,e:"Income is money EARNED by the business from normal operations — selling goods (sales/turnover) or providing services. Income increases owner's equity."},
  {t:'concepts',q:"What is an EXPENSE in accounting?",o:["Money received from customers","Costs paid by the business in the process of earning income","Loans given to employees","The profit of the business"],a:1,e:"Expenses are costs incurred to generate income — wages, rent, electricity, stationery, and insurance are all expenses. Expenses reduce owner's equity."},
  {t:'concepts',q:"What is NET PROFIT?",o:["Total income earned","Total expenses paid","The amount remaining when total income EXCEEDS total expenses (Income – Expenses)","Money invested by the owner"],a:2,e:"Net Profit = Income – Expenses. When a business earns more than it spends, the difference is net profit. Profit increases owner's equity."},
  {t:'concepts',q:"What are DRAWINGS in accounting?",o:["Diagrams in accounting records","Money or goods taken OUT of the business by the owner for PERSONAL use","Depreciation of assets","Cash received from customers"],a:1,e:"Drawings are amounts taken out by the owner for personal use — cash or goods. Drawings REDUCE owner's equity and are NOT a business expense."},
  {t:'concepts',q:"What is DOUBLE-ENTRY bookkeeping?",o:["Recording every transaction twice in the same account","Every transaction is recorded in at least TWO accounts — every debit has a corresponding credit","Using two separate cashbooks","Keeping two sets of financial records"],a:1,e:"Double-entry means every transaction is recorded with EQUAL debits AND credits. If you debit one account, you must credit another — keeping the accounting equation balanced."},
  {t:'concepts',q:"What does a DEBIT entry do to an ASSET account?",o:["Decreases the asset","Increases the asset — assets are increased by debits","Has no effect","Closes the account"],a:1,e:"Debits INCREASE asset accounts and expense accounts. Debits DECREASE liability, equity, and income accounts. Assets increase on the LEFT (debit) side."},
  /* SOURCE DOCUMENTS */
  {t:'docs',q:"What is a SOURCE DOCUMENT?",o:["A textbook for studying accounting","The original written proof that a financial transaction took place","The owner's personal diary","A document showing staff details"],a:1,e:"A source document is the original written evidence proving a financial transaction occurred. It is the STARTING POINT for all accounting entries — no entry without a source document."},
  {t:'docs',q:"Why are source documents important?",o:["Only needed for tax purposes","They prove transactions occurred, enable accurate recording, and support auditing and dispute resolution","Only important for large businesses","They replace the need for journals"],a:1,e:"Source documents provide PROOF of transactions, allow accurate recording in journals, are essential for auditing, and help resolve disputes about whether a transaction happened."},
  {t:'docs',q:"What is a RECEIPT (cash receipt)?",o:["A document sent to a customer who bought on credit","Written proof given to a customer when they pay CASH for goods or services","A bill sent to the business by a supplier","A document showing the owner's drawings"],a:1,e:"A receipt is proof that CASH has been received from a customer. It is issued by the business to the person who paid, and is the source document for the Cash Receipts Journal."},
  {t:'docs',q:"When a customer pays cash at a shop, which document do they receive?",o:["A cheque","A credit note","A receipt or till slip","A purchase order"],a:2,e:"Cash payment → the customer receives a RECEIPT or TILL SLIP. This is proof of the cash sale and is used as the source document for the CRJ entry."},
  {t:'docs',q:"What is an INVOICE?",o:["A document that reduces what a customer owes","A document requesting payment from a customer who bought on CREDIT","A document showing cash received","A bank statement"],a:1,e:"An invoice is issued to a CREDIT customer — it lists goods/services provided and the amount owed. The customer becomes a DEBTOR when an invoice is issued."},
  {t:'docs',q:"What is a CREDIT NOTE?",o:["A note from the bank increasing the balance","A document issued to REDUCE the amount a credit customer owes — e.g. for returned goods","A document for cash sales","A cheque given to a supplier"],a:1,e:"A credit note is issued to a DEBTOR when goods are returned, there is a pricing error, or goods are damaged. It REDUCES what the customer owes the business."},
  {t:'docs',q:"What is a DEBIT NOTE?",o:["A note reducing what a creditor is owed, issued by the creditor","A document the business sends to a SUPPLIER to request a reduction — e.g. because goods were returned to the supplier","A note from the bank","A receipt for cash paid to someone"],a:1,e:"A debit note is issued by the business TO a creditor (supplier) when goods are returned or overcharged. It requests the supplier to reduce the amount the business owes."},
  {t:'docs',q:"What does an ELECTRONIC FUNDS TRANSFER (EFT) confirmation serve as?",o:["A credit note","Proof of electronic payment — the modern equivalent of a cheque","A list of goods ordered","A till slip for cash sales"],a:1,e:"An EFT confirmation is proof that an electronic payment was made — it serves the same role as a cheque and is a source document for the Cash Payments Journal."},
  {t:'docs',q:"What does a BANK STATEMENT show?",o:["Assets owned by the business","A bank-issued record of all deposits, withdrawals, fees, and the running balance of the business's bank account","The profit of the business","Employee salaries"],a:1,e:"A bank statement is issued by the bank showing all transactions — deposits, withdrawals, bank charges, interest — and the running bank balance. Used to do bank reconciliation."},
  {t:'docs',q:"What is a TILL SLIP?",o:["A document for credit purchases","Printed proof of a CASH SALE, generated automatically by a cash register or POS system","A cheque given by the business","An order placed to a supplier"],a:1,e:"A till slip is automatically printed when a cash sale is made at a cash register. It proves the sale and shows date, items, amounts, and VAT charged."},
  {t:'docs',q:"What is a PURCHASE ORDER?",o:["A receipt for goods already paid","A document sent BY the business TO a supplier to officially request goods or services","A document reducing what a creditor is owed","A bank instruction to pay"],a:1,e:"A purchase order is sent to a supplier to formally request specific goods at agreed prices. It initiates the purchasing process before goods are received or invoices are issued."},
  {t:'docs',q:"What is a DELIVERY NOTE?",o:["A note about cash delivered to the bank","A document accompanying goods to confirm the correct goods were delivered and received","A tax invoice","A list of outstanding debtors"],a:1,e:"A delivery note travels with goods from the supplier. The receiver checks it against the goods, signs it as confirmation, and keeps it as proof of receipt."},
  {t:'docs',q:"Which source document is used for entries in the CASH RECEIPTS JOURNAL?",o:["Invoices issued to creditors","Receipts and till slips — proof of CASH received by the business","Debit notes sent to suppliers","Bank loan agreements"],a:1,e:"The CRJ records all CASH received. The source documents are RECEIPTS (for cash sales) and TILL SLIPS — both prove money came into the business."},
  {t:'docs',q:"A credit customer returns goods. What does the business issue?",o:["An invoice","A receipt","A credit note — reducing the amount the customer owes","A purchase order"],a:2,e:"Returned goods from a CREDIT customer → issue a CREDIT NOTE. This reduces (credits) the debtor's account — the customer owes less."},
  {t:'docs',q:"What information MUST appear on a valid source document?",o:["Only business name and date","Business name, date, sequential number, description, amount, and the parties involved","Only the amount and customer name","Only the VAT number"],a:1,e:"A valid source document must show: business name, date, sequential number, description of goods/services, amount, VAT details (if applicable), and details of both parties."},
  /* ACCOUNTING CYCLE */
  {t:'cycle',q:"What is the ACCOUNTING CYCLE?",o:["The monthly cycle of paying employees","The sequence of steps to process and report financial transactions — from source document to financial statements","The annual external audit process","The buying and selling cycle of a business"],a:1,e:"The accounting cycle is the step-by-step process: Source Document → Journal → Ledger → Trial Balance → Financial Statements. It repeats each accounting period."},
  {t:'cycle',q:"What is the CORRECT order of the first three steps of the accounting cycle?",o:["Trial Balance → Journal → Ledger","Ledger → Journal → Source Document","Source Document → Journal → Ledger","Journal → Source Document → Ledger"],a:2,e:"Correct order: Source Document (proof) → Journal (first recording) → Ledger (posting to accounts) → Trial Balance → Financial Statements."},
  {t:'cycle',q:"What is a JOURNAL (subsidiary journal)?",o:["The final financial report","The BOOK OF FIRST ENTRY — where transactions are first recorded in date order from source documents","The account showing the bank balance","A list of all business assets"],a:1,e:"A journal is the book of FIRST ENTRY. Transactions are recorded here first, in date order, directly from source documents. Examples: Cash Receipts Journal, Cash Payments Journal."},
  {t:'cycle',q:"What is the GENERAL LEDGER?",o:["A source document given to customers","The BOOK OF SECOND ENTRY — where journal entries are posted to individual T-accounts","A daily record of cash received","The bank statement"],a:1,e:"The General Ledger is the book of SECOND ENTRY. Journal entries are POSTED (transferred) here into individual T-accounts — e.g. Bank Account, Sales Account, Debtors Control Account."},
  {t:'cycle',q:"What is a TRIAL BALANCE?",o:["A test given to accounting students","A list of all ledger account balances to verify that total debits equal total credits","A list of all debtors","The final income statement"],a:1,e:"A Trial Balance lists all General Ledger account balances. If total DEBITS = total CREDITS, the books are mathematically balanced. Prepared BEFORE financial statements."},
  {t:'cycle',q:"What is POSTING in the accounting cycle?",o:["Collecting and sorting source documents","Transferring entries from journals to the relevant accounts in the General Ledger","Preparing financial statements","Drawing up the trial balance"],a:1,e:"POSTING is the transfer of information from subsidiary journals into the appropriate T-accounts in the General Ledger. It is the second step after journalising."},
  {t:'cycle',q:"What are the TWO main financial statements prepared at the end of the accounting cycle?",o:["Only the bank statement","The Income Statement and the Balance Sheet","Only the trial balance","Only the cash flow statement"],a:1,e:"The two main financial statements are: the INCOME STATEMENT (showing profit or loss for the period) and the BALANCE SHEET (showing assets, liabilities, and equity at a date)."},
  {t:'cycle',q:"What does the INCOME STATEMENT show?",o:["Assets and liabilities at a specific date","Income, expenses, and the resulting net profit or loss over a period of time","Only the cash balance","A list of debtors and creditors"],a:1,e:"The Income Statement shows: Total Income – Total Expenses = Net Profit (or Loss) for a specific PERIOD (e.g. the financial year ended 28 February)."},
  {t:'cycle',q:"What does the BALANCE SHEET show?",o:["Monthly sales figures","A snapshot of assets, liabilities, and owner's equity AT A SPECIFIC DATE","All expenses paid during the year","Wages paid to employees"],a:1,e:"The Balance Sheet (Statement of Financial Position) is a snapshot at a SPECIFIC DATE: what the business owns (assets), owes (liabilities), and the owner's interest (equity). Assets = Liabilities + Equity."},
  {t:'cycle',q:"Why is the accounting cycle important?",o:["It is only required by law","It ensures accurate records, provides reliable financial information for decision-making, and keeps the business accountable","It replaces the need for source documents","It is only useful for large companies"],a:1,e:"The accounting cycle ensures transactions are accurately and consistently recorded — enabling informed decisions, meeting legal requirements, attracting investors, and detecting errors or fraud."},
  {t:'cycle',q:"After completing the accounting cycle, the owner notices total expenses exceeded total income. What does this mean?",o:["The business made a profit","The business made a NET LOSS — expenses were greater than income","The balance sheet will not balance","The trial balance has an error"],a:1,e:"When Expenses > Income, the result is a NET LOSS. This DECREASES owner's equity. The owner needs to investigate why costs exceeded revenue."},
  /* CASH RECEIPTS JOURNAL */
  {t:'crj',q:"What is the CASH RECEIPTS JOURNAL (CRJ)?",o:["A journal recording all CASH paid OUT by the business","A subsidiary journal recording ALL cash, cheques, and EFTs RECEIVED by the business","A list of all credit sales","The business's bank statement"],a:1,e:"The CRJ is a subsidiary journal (book of first entry) that records ALL money RECEIVED by the business — cash sales, debtor payments, capital deposits, and any other cash inflows."},
  {t:'crj',q:"What TYPES of transactions are recorded in the CRJ?",o:["All credit sales on account","All cash payments to suppliers","All money RECEIVED — cash sales, debtor payments, capital contributions, and other cash receipts","Only bank deposits made by the owner"],a:2,e:"The CRJ records ALL money flowing INTO the business: cash sales, debtors paying their accounts, owner depositing capital, rent received, and any other cash receipt."},
  {t:'crj',q:"Which SOURCE DOCUMENT is used for CRJ entries?",o:["Invoices sent to credit customers","Credit notes sent to debtors","Receipts and till slips — proof of CASH received","Purchase orders sent to suppliers"],a:2,e:"RECEIPTS (issued by the business to cash payers) and TILL SLIPS (from the cash register) are the source documents for the CRJ — they prove money was received."},
  {t:'crj',q:"What does the DOC NO column in the CRJ record?",o:["The ledger page number","The sequential number of the source document (e.g. Receipt No. 001)","The customer's ID number","The date of the transaction"],a:1,e:"Doc No records the unique sequential number of the source document — Receipt No. 001, Receipt No. 002, etc. This allows every journal entry to be traced back to its source document."},
  {t:'crj',q:"What does the BANK column in the CRJ represent?",o:["The opening bank balance","The TOTAL of all money received — every rand to be deposited into the bank account","Bank charges for the month","Only cash sale amounts"],a:1,e:"The BANK column is the TOTAL column — every rand received is recorded here because all receipts are deposited. Bank column total MUST equal the sum of all other analysis column totals."},
  {t:'crj',q:"A debtor pays their account in cash (R1 500). Which CRJ columns are used (besides Bank)?",o:["Sales column","Capital column","Debtors column — R1 500","Sundry accounts column"],a:2,e:"Debtor paying cash → BANK R1 500 (money in) and DEBTORS column R1 500 (reducing the amount owed to the business). The debtor's account is credited in the ledger."},
  {t:'crj',q:"A CASH SALE of R800 is made. Which CRJ columns are used?",o:["Bank column only","Debtors and Bank","Bank column R800 AND Sales column R800","Sundry accounts and Bank"],a:2,e:"Cash sale → BANK R800 (money received and deposited) AND SALES column R800 (income earned from selling). Both columns show R800."},
  {t:'crj',q:"What is the SUNDRY ACCOUNTS column used for in the CRJ?",o:["Recording all daily cash sales","Unusual or once-off receipts that don't fit a standard column — like capital deposited by the owner","Only debtor payments","Recording bank charges"],a:1,e:"Sundry Accounts captures miscellaneous, irregular cash receipts — e.g. owner depositing capital, rent income received, interest received. Each item is individually named with a ledger folio."},
  {t:'crj',q:"The owner deposits R25 000 capital into the business account. How is this recorded in the CRJ?",o:["Bank R25 000 and Sales R25 000","Bank R25 000 and Sundry Accounts R25 000 (described as Capital)","Debtors R25 000 and Bank R25 000","Bank column only — R25 000"],a:1,e:"Owner deposits capital → BANK R25 000 (money in) and SUNDRY ACCOUNTS R25 000 (described as 'Capital' with the ledger account folio). It's sundry because there's no dedicated capital column."},
  {t:'crj',q:"At MONTH END, what must the bookkeeper do with the CRJ?",o:["File it away and start a new one","Total all columns, verify Bank = sum of all other columns, then POST totals to the General Ledger","Send the totals to SARS immediately","Only check the debtors column"],a:1,e:"Month end procedure: 1) Total all columns. 2) Check Bank total = sum of all analysis columns. 3) POST column totals to the General Ledger. Each column is posted to its account."},
  {t:'crj',q:"CRJ totals: Bank = R18 600, Sales = R11 200, Debtors = R7 400. Is this correct?",o:["No — debtors should be larger than sales","YES — R11 200 + R7 400 = R18 600 = Bank total. The columns balance!","No — Bank should equal only the Sales column","No — all three columns should be equal"],a:1,e:"YES! R11 200 (Sales) + R7 400 (Debtors) = R18 600 = Bank total. RULE: Bank column = sum of ALL analysis columns. The CRJ balances!"},
  {t:'crj',q:"What does POSTING from the CRJ to the General Ledger mean?",o:["Mailing the CRJ to the bank","Transferring the monthly column TOTALS from the CRJ into the appropriate ledger accounts","Archiving the CRJ at year end","Printing the CRJ for the owner"],a:1,e:"Posting = transferring monthly column totals from the CRJ into T-accounts in the General Ledger. E.g. Sales total → credited in Sales Account; Bank total → debited in Bank Account."},
  {t:'crj',q:"Where is the BANK column total of the CRJ posted in the General Ledger?",o:["Creditors Control — credit side","Bank Account — DEBIT side (money coming IN increases the bank balance)","Sales Account — debit side","Debtors Control — credit side"],a:1,e:"Bank column total → DEBITED in the Bank Account (General Ledger). Money coming IN increases the bank balance. Assets increase on the DEBIT (left) side."},
  {t:'crj',q:"Where is the SALES column total of the CRJ posted?",o:["Sales Account — debit side","Bank Account — credit side","Sales Account — CREDIT side (income increases on the credit side)","Debtors Control — debit side"],a:2,e:"Sales column total → CREDITED in the Sales Account (General Ledger). Income accounts INCREASE on the CREDIT side. The business earned this revenue from selling goods."},
  {t:'crj',q:"Where is the DEBTORS column total of the CRJ posted?",o:["Debtors Control Account — debit side","Bank Account — credit side","Debtors Control Account — CREDIT side (reducing what debtors owe)","Sales Account — debit side"],a:2,e:"Debtors column total → CREDITED in the Debtors Control Account. Cash received FROM debtors REDUCES the amount they owe — this is a credit entry (reducing the asset)."}
];

let ord=[],cur=0,sc=0,wr=0,strk=0,ans=false;
function shuf(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function restart(){
  ord=shuf([...Array(Q.length).keys()]);
  cur=0;sc=0;wr=0;strk=0;ans=false;
  document.getElementById('ss').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('hdr').style.display='block';
  updStats();render();
}

function updStats(){
  const p=cur===0?0:Math.round(sc/cur*100);
  document.getElementById('lpct').textContent=(cur===0?'0':p)+'%';
  document.getElementById('lco').textContent=sc+' correct';
  document.getElementById('lwr').textContent=wr+' wrong';
}

function render(){
  const qi=ord[cur],q=Q[qi],tot=Q.length,pp=Math.round(cur/tot*100);
  document.getElementById('pfill').style.width=pp+'%';
  document.getElementById('qlbl').textContent='Question '+(cur+1)+' of '+tot;
  document.getElementById('qpct').textContent=pp+'%';
  document.getElementById('qnum').textContent='Q'+(cur+1);
  document.getElementById('ttag').innerHTML='<span class="topic-tag '+TCOL[q.t]+'">'+TLBL[q.t]+'</span>';
  const sb=document.getElementById('strk');
  if(strk>=3){const f=strk>=7?'🔥🔥🔥':strk>=5?'🔥🔥':'🔥';sb.innerHTML='<div class="streak-badge">'+f+' '+strk+' IN A ROW!</div>';}
  else sb.innerHTML='';
  document.getElementById('qtxt').textContent=q.q;
  const sho=shuf(q.o.map(function(text,oi){return{text:text,oi:oi};}));
  const el=document.getElementById('opts');el.innerHTML='';
  sho.forEach(function(opt,i){
    const b=document.createElement('button');
    b.className='opt-btn';
    b.innerHTML='<span class="opt-letter">'+LTRS[i]+'</span><span>'+opt.text+'</span>';
    b.onclick=function(){doAns(b,opt.oi,q.a,sho,q.e);};
    el.appendChild(b);
  });
  document.getElementById('fb').className='fb-box';
  document.getElementById('fb').innerHTML='';
  document.getElementById('nxt').className='next-btn';
  ans=false;
  const c=document.getElementById('qcard');c.style.animation='none';void c.offsetWidth;c.style.animation='';
}

function doAns(btn,chosen,correct,sho,exp){
  if(ans)return;ans=true;
  document.querySelectorAll('.opt-btn').forEach(function(b){b.disabled=true;});
  const fb=document.getElementById('fb');
  if(chosen===correct){
    btn.classList.add('correct');sc++;strk++;confetti(16);
    fb.className='fb-box ok show';
    fb.innerHTML='<span class="fb-icon">🎉</span><div><strong>Correct!</strong>'+exp+'</div>';
  } else {
    btn.classList.add('wrong');wr++;strk=0;
    document.querySelectorAll('.opt-btn').forEach(function(b){
      const txt=b.querySelector('span:last-child').textContent;
      const f=sho.find(function(o){return o.text===txt;});
      if(f&&f.oi===correct)b.classList.add('reveal');
    });
    fb.className='fb-box bad show';
    fb.innerHTML='<span class="fb-icon">😬</span><div><strong>Not quite!</strong>'+exp+'</div>';
  }
  updStats();
  document.getElementById('nxt').className='next-btn show';
}

document.getElementById('nxt').onclick=function(){cur++;cur>=Q.length?showScore():render();};

function showScore(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('hdr').style.display='none';
  const ss=document.getElementById('ss');ss.style.display='block';
  const tot=Q.length,pct=Math.round(sc/tot*100);
  document.getElementById('epct').textContent=pct+'%';
  document.getElementById('epct2').textContent=pct+'%';
  document.getElementById('efrac').textContent=sc+' / '+tot;
  document.getElementById('eco').textContent=sc;
  document.getElementById('ewr').textContent=wr;
  var tr,ttl,msg;
  if(pct>=90){tr='🏆';ttl='ACCOUNTING GENIUS!';msg='Incredible! You absolutely nailed it! You clearly understand accounting concepts, source documents, the cycle, and the CRJ inside out. Future accountant spotted!';}
  else if(pct>=75){tr='🥇';ttl='BRILLIANT WORK!';msg='Fantastic score! You have a strong grasp of accounting basics. Review the questions you missed and you will be unstoppable in your exam!';}
  else if(pct>=60){tr='🥈';ttl='GOOD EFFORT!';msg='You are getting the hang of it! Focus on the topics you found tricky — especially the CRJ columns and the accounting cycle steps. You have got this!';}
  else if(pct>=50){tr='🥉';ttl='KEEP GOING!';msg='Halfway there! Accounting takes practice. Go back to your notes, revise the accounting cycle and source documents carefully, and try again!';}
  else{tr='💡';ttl='MORE PRACTICE NEEDED!';msg="Don't stress — accounting can be tricky at first! Revise your CAPS textbook one topic at a time and come back ready to crush it!";}
  document.getElementById('troph').textContent=tr;
  document.getElementById('etitle').textContent=ttl;
  document.getElementById('emsg').textContent=msg;
  if(pct>=60)confetti(50);
}

function confetti(n){
  const w=document.getElementById('cw');
  for(var i=0;i<n;i++){
    var el=document.createElement('div');
    el.className='cp';
    var c=CC[Math.floor(Math.random()*CC.length)];
    var l=Math.random()*100,delay=Math.random()*.9,dur=1.6+Math.random()*1.6,sz=7+Math.random()*10,rot=Math.random()*360;
    var shape=Math.random()>.5?'50%':'3px';
    el.style.cssText='left:'+l+'%;background:'+c+';width:'+sz+'px;height:'+sz+'px;animation-duration:'+dur+'s;animation-delay:'+delay+'s;transform:rotate('+rot+'deg);border-radius:'+shape+';border:1.5px solid rgba(0,0,0,.15)';
    w.appendChild(el);
    (function(e,d,du){setTimeout(function(){e.remove();},(du+d+.6)*1000);})(el,delay,dur);
  }
}

restart();
</script>
