<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Accounting Equation Trainer
</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
135deg,
#0f172a,
#2563eb,
#7c3aed,
#ec4899
);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
font-size:50px;
text-shadow:0 0 15px gold;
}

.card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
margin-top:20px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

#question{
font-size:32px;
margin-bottom:25px;
min-height:80px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:2px solid white;
padding:15px;
font-size:20px;
}

th{
background:#111827;
}

select{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:none;
}

button{
padding:18px 35px;
font-size:24px;
border:none;
border-radius:15px;
cursor:pointer;
background:#facc15;
font-weight:bold;
margin-top:25px;
}

button:hover{
transform:scale(1.03);
}

#feedback{
font-size:28px;
margin-top:20px;
font-weight:bold;
min-height:40px;
}

#scoreBoard{
font-size:26px;
margin-top:20px;
}

.correct{
color:#22c55e;
}

.wrong{
color:#ef4444;
}

</style>

</head>

<body>

<div class="container">

<h1>
💰 ACCOUNTING EQUATION TRAINER 💰
</h1>

<div class="card">

<h2 id="question">
Loading...
</h2>

<table>

<tr>

<th></th>

<th>Assets</th>

<th>Owner’s Equity</th>

<th>Liabilities</th>

</tr>

<tr>

<th>Effect</th>

<td>

<select id="assetEffect">

<option value="">Choose</option>
<option>Increase</option>
<option>Decrease</option>
<option>No Effect</option>

</select>

</td>

<td>

<select id="oeEffect">

<option value="">Choose</option>
<option>Increase</option>
<option>Decrease</option>
<option>No Effect</option>

</select>

</td>

<td>

<select id="liabilityEffect">

<option value="">Choose</option>
<option>Increase</option>
<option>Decrease</option>
<option>No Effect</option>

</select>

</td>

</tr>

<tr>

<th>Reason</th>

<td>

<select id="assetReason">

<option value="">Choose</option>
<option>Cash received</option>
<option>Cash paid</option>
<option>Asset bought</option>
<option>Asset sold</option>
<option>No change</option>

</select>

</td>

<td>

<select id="oeReason">

<option value="">Choose</option>
<option>Income earned</option>
<option>Expense incurred</option>
<option>Capital introduced</option>
<option>Drawings</option>
<option>No change</option>

</select>

</td>

<td>

<select id="liabilityReason">

<option value="">Choose</option>
<option>Loan received</option>
<option>Loan repaid</option>
<option>Credit purchase</option>
<option>Credit payment</option>
<option>No change</option>

</select>

</td>

</tr>

</table>

<button onclick="checkAnswer()">
CHECK ANSWER 🚀
</button>

<div id="feedback"></div>

<div id="scoreBoard">

⭐ Score:
<span id="score">0</span>

</div>

</div>

</div>

<script>

// =============================
// BUZZERS
// =============================

const correctSound = new Audio(
'https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg'
);

const wrongSound = new Audio(
'https://actions.google.com/sounds/v1/alarms/beep_short.ogg'
);

// =============================
// SHUFFLE FUNCTION
// =============================

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}
// =============================
// QUESTIONS
// =============================

const questions = [

{
q:'Received R2 500 cash for services rendered.',
asset:'Increase',
assetReason:'Cash received',
oe:'Increase',
oeReason:'Income earned',
liability:'No Effect',
liabilityReason:'No change'
},

{
q:'The owner introduced R10 000 capital.',
asset:'Increase',
assetReason:'Cash received',
oe:'Increase',
oeReason:'Capital introduced',
liability:'No Effect',
liabilityReason:'No change'
},

{
q:'Received a loan of R15 000 from the bank.',
asset:'Increase',
assetReason:'Cash received',
oe:'No Effect',
oeReason:'No change',
liability:'Increase',
liabilityReason:'Loan received'
},

{
q:'Paid rent expense of R1 200.',
asset:'Decrease',
assetReason:'Cash paid',
oe:'Decrease',
oeReason:'Expense incurred',
liability:'No Effect',
liabilityReason:'No change'
},

{
q:'Owner withdrew R900 cash for personal use.',
asset:'Decrease',
assetReason:'Cash paid',
oe:'Decrease',
oeReason:'Drawings',
liability:'No Effect',
liabilityReason:'No change'
},

{
q:'Bought equipment for cash.',
asset:'No Effect',
assetReason:'Asset bought',
oe:'No Effect',
oeReason:'No change',
liability:'No Effect',
liabilityReason:'No change'
},

{
q:'Received rent income of R2 000.',
asset:'Increase',
assetReason:'Cash received',
oe:'Increase',
oeReason:'Income earned',
liability:'No Effect',
liabilityReason:'No change'
},

{
q:'Paid back part of a loan.',
asset:'Decrease',
assetReason:'Cash paid',
oe:'No Effect',
oeReason:'No change',
liability:'Decrease',
liabilityReason:'Loan repaid'
},

{
q:'Bought trading stock on credit.',
asset:'Increase',
assetReason:'Asset bought',
oe:'No Effect',
oeReason:'No change',
liability:'Increase',
liabilityReason:'Credit purchase'
},

{
q:'Paid a creditor.',
asset:'Decrease',
assetReason:'Cash paid',
oe:'No Effect',
oeReason:'No change',
liability:'Decrease',
liabilityReason:'Credit payment'
}

];

// =============================
// SHUFFLE QUESTIONS
// =============================

shuffleArray(questions);

// =============================
// VARIABLES
// =============================

let currentQuestion=0;
let score=0;
// =============================
// LOAD QUESTION
// =============================

function loadQuestion(){

const q = questions[currentQuestion];

document.getElementById(
'question'
).innerHTML =

`Question ${currentQuestion+1}/${questions.length}
<br><br>
${q.q}`;

// RESET DROPDOWNS

document.getElementById(
'assetEffect'
).value='';

document.getElementById(
'assetReason'
).value='';

document.getElementById(
'oeEffect'
).value='';

document.getElementById(
'oeReason'
).value='';

document.getElementById(
'liabilityEffect'
).value='';

document.getElementById(
'liabilityReason'
).value='';

document.getElementById(
'feedback'
).innerHTML='';

}

// =============================
// CHECK ANSWER
// =============================

function checkAnswer(){

const q = questions[currentQuestion];

const assetEffect =
document.getElementById(
'assetEffect'
).value;

const assetReason =
document.getElementById(
'assetReason'
).value;

const oeEffect =
document.getElementById(
'oeEffect'
).value;

const oeReason =
document.getElementById(
'oeReason'
).value;

const liabilityEffect =
document.getElementById(
'liabilityEffect'
).value;

const liabilityReason =
document.getElementById(
'liabilityReason'
).value;

// =============================
// CHECK ALL ANSWERS
// =============================

if(

assetEffect===q.asset &&
assetReason===q.assetReason &&
oeEffect===q.oe &&
oeReason===q.oeReason &&
liabilityEffect===q.liability &&
liabilityReason===q.liabilityReason

){

correctSound.play();

score += 10;

document.getElementById(
'feedback'
).innerHTML =
'✅ CORRECT!';

document.getElementById(
'feedback'
).className='correct';

}else{

wrongSound.play();

document.getElementById(
'feedback'
).innerHTML =
'❌ TRY AGAIN';

document.getElementById(
'feedback'
).className='wrong';

}

document.getElementById(
'score'
).innerHTML=score;

// =============================
// NEXT QUESTION
// =============================

setTimeout(()=>{

currentQuestion++;

if(currentQuestion>=questions.length){

endGame();

}else{

loadQuestion();

}

},1200);

}
// =============================
// END GAME
// =============================

function endGame(){

document.querySelector(
'.card'
).innerHTML = `

<h1>
🏆 GAME COMPLETE!
</h1>

<h2>
FINAL SCORE: ${score}
</h2>

<button onclick="location.reload()">

PLAY AGAIN 🔄

</button>

`;

}

// =============================
// START GAME
// =============================

loadQuestion();

</script>

</body>

</html>
