body{
margin:0;

background:linear-gradient(

#0f172a,
#1e3a8a,
#7c3aed,
#ec4899
);
color:white;
overflow-x:hidden;
text-align:center;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

h1{
font-size:52px;
text-shadow:0 0 20px gold;
}

.gameCard{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
border-radius:25px;
padding:30px;
margin-top:20px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.stats{
display:flex;
justify-content:space-around;
flex-wrap:wrap;

margin-bottom:20px;

#question{
font-size:32px;

}

.option{
display:block;
width:85%;
margin:15px auto;
padding:18px;
font-size:20px;
border:none;
border-radius:16px;
cursor:pointer;
transition:0.2s;
background:white;
color:black;
font-weight:bold;
}

.option:hover{
transform:scale(1.03);
background:#facc15;
}

#levelBanner{
font-size:28px;
margin-top:15px;
color:#facc15;
font-weight:bold;
}

#message{
font-size:26px;
margin-top:20px;
min-height:40px;
}

.btn{
padding:18px 30px;
font-size:22px;
border:none;
border-radius:18px;
cursor:pointer;
background:#facc15;
font-weight:bold;
margin-top:20px;
}

.progressBar{
width:100%;
height:25px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

#progressFill{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#22c55e,
#facc15,
#ec4899
);
}

</style>

// SHUFFLE FUNCTION
// =============================

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

...conceptQuestions,
...sourceDocumentQuestions,
...accountingEquationQuestions,
...journalQuestions

];

shuffleArray(questions);

// =============================
// GAME VARIABLES
// =============================

let current=0;
let score=0;
let streak=0;
let lives=10;
let timer;
let timeLeft=10;

// =============================
// START GAME
// =============================

function startGame(){

document.getElementById(
'startScreen'
).style.display='none';

document.getElementById(
'gameScreen'
).style.display='block';

loadQuestion();

}

// =============================
// LOAD QUESTION
// =============================

function loadQuestion(){

clearInterval(timer);

timeLeft=10;

updateStats();

const q=questions[current];

const progress=
(current/questions.length)*100;

document.getElementById(
'progressFill'
).style.width=progress+'%';

document.getElementById(
'levelBanner'
).innerHTML=q.l;

document.getElementById(
'question'
).innerHTML=
`Question ${current+1}/${questions.length}<br><br>${q.q}`;

// =============================
// SHUFFLE ANSWERS
// =============================

const shuffledAnswers =
q.a.map((answer,index)=>({
answer,
index
}));

shuffleArray(shuffledAnswers);

window.currentCorrect =
shuffledAnswers.findIndex(
item => item.index === q.c
);

let html='';

shuffledAnswers.forEach((item,index)=>{

html += `
<button class='option'
onclick='checkAnswer(${index})'>
${item.answer}
</button>
`;

});

document.getElementById(
'answers'
).innerHTML=html;

document.getElementById(
'message'
).innerHTML='';

startTimer();

}

// =============================
// TIMER
// =============================

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById(
'timer'
).innerHTML=timeLeft;

if(timeLeft<=0){

clearInterval(timer);

wrongAnswer('⏰ TIME UP!');

}

},1000);

}

// =============================
// CHECK ANSWER
// =============================

function checkAnswer(index){

clearInterval(timer);

if(index===window.currentCorrect){

correctSound.play();

score += 10 + (streak*2);

streak++;

correctMessage();

}else{

wrongSound.play();

wrongAnswer('❌ WRONG!');

}

}

// =============================
// CORRECT MESSAGE
// =============================

function correctMessage(){

const messages=[
'🔥 COMBO!',
'⚡ AMAZING!',
'💰 MONEY MASTER!',
'🚀 TOO FAST!',
'🎯 PERFECT!',
'👑 ACCOUNTING LEGEND!'
];

const random=
messages[Math.floor(
Math.random()*messages.length
)];

document.getElementById(
'message'
).innerHTML=random;

updateStats();

setTimeout(()=>{
nextQuestion();
},800);

}

// =============================
// WRONG ANSWER
// =============================

function wrongAnswer(msg){

streak=0;

lives--;

document.getElementById(
'message'
).innerHTML=msg;

updateStats();

if(lives<=0){

setTimeout(()=>{

alert(
'💥 EXTRA LIVES UNLOCKED!'
);

lives=10;

updateStats();

nextQuestion();

},500);

return;

}

setTimeout(()=>{
nextQuestion();
},1000);

}

// =============================
// NEXT QUESTION
// =============================

function nextQuestion(){

current++;

if(current>=questions.length){

endGame();

return;

}

loadQuestion();

}

// =============================
// UPDATE STATS
// =============================

function updateStats(){

document.getElementById(
'score'
).innerHTML=score;

document.getElementById(
'streak'
).innerHTML=streak;

document.getElementById(
'timer'
).innerHTML=timeLeft;

document.getElementById(
'lives'
).innerHTML=lives;

}

// =============================
// END GAME
// =============================

function endGame(){

clearInterval(timer);

document.getElementById(
'gameScreen'
).style.display='none';

document.getElementById(
'endScreen'
).style.display='block';

document.getElementById(
'finalScore'
).innerHTML=
`${score} POINTS`;

let rank='';

if(score>700){

rank='👑 ACCOUNTING LEGEND';

}else if(score>500){

rank='💎 EMS CHAMPION';

}else if(score>300){

rank='📘 ACCOUNTING MASTER';

}else{

rank='⭐ FUTURE ACCOUNTANT';

}

document.getElementById(
'finalRank'
).innerHTML=rank;

}
