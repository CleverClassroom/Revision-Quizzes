<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 Accounting Mega Quiz</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    margin: 0;
    padding: 0;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.12);
    padding: 30px;
    border-radius: 20px;
    margin-top: 30px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

h1 {
    font-size: 42px;
}

#question {
    font-size: 28px;
    margin-bottom: 25px;
}

.option {
    display: block;
    background: white;
    color: black;
    margin: 12px auto;
    padding: 18px;
    width: 85%;
    border-radius: 12px;
    cursor: pointer;
    font-size: 20px;
    transition: 0.3s;
    border: none;
}

.option:hover {
    transform: scale(1.03);
    background: #ffe082;
}

.correct {
    background: #66bb6a !important;
    color: white;
}

.wrong {
    background: #ef5350 !important;
    color: white;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
}

#nextBtn {
    background: #ffca28;
}

#restartBtn {
    background: #26c6da;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

#score, #timer {
    font-size: 24px;
    font-weight: bold;
}

#progress {
    font-size: 20px;
    margin-bottom: 15px;
}

#result {
    font-size: 34px;
    margin-top: 25px;
}
</style>
</head>
<body>

<div class="container">
    <h1>💰 Grade 8 Accounting Mega Quiz 💰</h1>

    <div class="topbar">
        <div id="score">Score: 0</div>
        <div id="timer">60:00</div>
    </div>

    <div class="card">
        <div id="progress"></div>
        <div id="question">Loading...</div>
        <div id="options"></div>
        <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question ➜</button>
        <button id="restartBtn" onclick="restartQuiz()" style="display:none;">Restart Quiz 🔄</button>
        <div id="result"></div>
    </div>
</div>

<audio id="correctSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<audio id="wrongSound">
<source src="https://actions.google.com/sounds/v1/alarms/buzzer.ogg" type="audio/ogg">
</audio>

<script>

correct: 1

a: ["teacher", "business", "bank", "principal"],

},

correct: 0
},
{
q: "Which journal records cash received?",
a: ["CPJ", "CRJ", "DJ", "SJ"],
correct: 1
},
{
q: "CRJ stands for:",
a: ["Cash Receipts Journal", "Credit Receipts Journal", "Cash Returns Journal", "Cash Recording Journal"],
correct: 0
},
{
q: "Which document proves money was received?",
a: ["Invoice", "Receipt", "Cheque", "Memo"],
correct: 1
},
{
q: "A liability is:",
a: ["Money owed by the business", "Cash in the bank", "Furniture", "Profit"],
correct: 0
},
{
q: "Which one is an expense?",
a: ["Rent income", "Commission income", "Water and electricity", "Capital"],
correct: 2
},
{
q: "Owner’s equity refers to:",
a: ["The owner’s share in the business", "A bank loan", "Expenses", "Cash sales"],
correct: 0
},
{
q: "Which journal records cash payments?",
a: ["CRJ", "CPJ", "SJ", "GJ"],
correct: 1
},
{
q: "Profit occurs when:",

},
{
q: "A till slip is proof of:",

correct: 0
},
{
q: "Which is an asset?",
a: ["Loan", "Equipment", "Creditors", "Rent expense"],
correct: 1
},
{
q: "An EFT is:",
a: ["Electronic Funds Transfer", "Easy Financial Transaction", "Electronic Finance Tax", "Extra Funds Transfer"],
correct: 0
},
{
q: "Which statement shows assets and liabilities?",
a: ["Income Statement", "Balance Sheet", "CRJ", "CPJ"],
correct: 1
},
{
q: "Income earned from services rendered is called:",
a: ["Expense", "Fees income", "Liability", "Drawings"],
correct: 1
},
{
q: "Cash received increases:",
a: ["Assets", "Expenses", "Liabilities", "Losses"],
correct: 0
},
{
q: "Which one is NOT a source document?",
a: ["Invoice", "Receipt", "Balance Sheet", "Till slip"],
correct: 2
},
{
q: "What does CPJ stand for?",
a: ["Cash Payments Journal", "Cash Profit Journal", "Credit Payments Journal", "Cash Purchases Journal"],
correct: 0
},
{
q: "Which account decreases when cash is paid?",
a: ["Bank", "Income", "Capital", "Sales"],
correct: 0
},
{
q: "Which financial statement shows profit or loss?",
a: ["Balance Sheet", "Income Statement", "Ledger", "CRJ"],
correct: 1
},
{
q: "What is capital?",
a: ["Money introduced by the owner", "Money borrowed", "Expenses", "Sales"],
correct: 0
},
{
q: "Drawings reduce:",
a: ["Assets", "Owner’s equity", "Income", "Liabilities"],

},
{
q: "Which source document is used for credit purchases?",
a: ["Receipt", "Invoice", "Till slip", "Cheque"],
correct: 1
},
{
q: "Which account is affected when rent is paid?",
a: ["Rent expense", "Sales", "Capital", "Creditors"],
correct: 0
},
{
q: "Cash sales are recorded in the:",
a: ["CRJ", "CPJ", "SJ", "PJ"],
correct: 0
},
{
q: "What type of account is Bank?",
a: ["Asset", "Expense", "Liability", "Income"],

},
{
q: "Which of the following is a liability?",
a: ["Equipment", "Debtors", "Loan", "Cash"],

},
{
q: "The Balance Sheet shows the financial position on a:",
a: ["Specific date", "Weekly basis", "Monthly basis", "Random date"],

},
{
q: "Which journal records paying electricity by EFT?",
a: ["CRJ", "CPJ", "SJ", "DJ"],

},

},

},
{

},
{

a: ["Assets and Owner’s Equity", "Expenses and Liabilities", "Income and Assets", "Expenses and Drawings"],
correct: 0
},
{
q: "Paying insurance by EFT affects which journal?",
a: ["CRJ", "CPJ", "SJ", "DJ"],
correct: 1
},
{
q: "Which statement is true about expenses?",
a: ["They decrease profit", "They increase profit", "They are assets", "They are liabilities"],
correct: 0
},
{
q: "The accounting cycle starts with:",
a: ["Source documents", "Financial statements", "Reports", "Budgets"],
correct: 0
},
{
q: "A receipt is used as proof of:",
a: ["Money received", "Money paid", "Borrowing money", "Profit"],

},
{
q: "What is the opposite of profit?",
a: ["Loss", "Income", "Capital", "Asset"],

},
{
q: "Which journal records money received from debtors?",
a: ["CRJ", "CPJ", "SJ", "PJ"],

},
{
q: "Which document is used for EFT payments?",
a: ["Proof of payment", "Invoice", "Receipt", "Till slip"],

},
{
q: "If expenses are greater than income, the business made a:",
a: ["Profit", "Loss", "Capital increase", "Sale"],

q: "Which account is reduced when the owner takes cash for personal use?",
a: ["Owner’s Equity", "Income", "Loan", "Creditors"],

a: ["Balance", "Decrease", "Increase", "Close"],

},
{
q: "What type of account is furniture?",
a: ["Asset", "Expense", "Income", "Liability"],

},
{
q: "Which journal records all cash receipts?",
a: ["CRJ", "CPJ", "SJ", "PJ"],
correct: 0
},
{
q: "Which journal records all cash payments?",
a: ["CRJ", "CPJ", "SJ", "PJ"],
correct: 1
},
{
q: "Which source document shows goods sold for cash?",
a: ["Till slip", "Invoice", "Cheque", "Letter"],
correct: 0
},
{
q: "Which account increases when fees are received?",
a: ["Income", "Expense", "Liability", "Drawings"],
correct: 0
},
{
q: "Which account decreases when rent is paid?",
a: ["Bank", "Sales", "Capital", "Loan"],
correct: 0
},
{
q: "What is another name for owner investment?",
a: ["Capital", "Expense", "Liability", "Loss"],
correct: 0
},
{
q: "What is the effect of receiving cash from a debtor?",
a: ["Assets increase", "Expenses increase", "Liabilities increase", "Loss increases"],
correct: 0
},
{
q: "Which financial statement contains assets?",
a: ["Balance Sheet", "Income Statement", "CRJ", "CPJ"],
correct: 0
},
{
q: "What type of account is insurance?",
a: ["Expense", "Asset", "Income", "Liability"],
correct: 0
}
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const scoreEl = document.getElementById('score');
const progressEl = document.getElementById('progress');
const resultEl = document.getElementById('result');
const nextBtn = document.getElementById('nextBtn');

function loadQuestion() {
    answered = false;
    nextBtn.style.display = 'none';

    const q = questions[currentQuestion];

    progressEl.innerHTML = `Question ${currentQuestion + 1} of ${questions.length}`;
    questionEl.innerHTML = q.q;
    optionsEl.innerHTML = '';

    q.a.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.innerText = option;
        btn.classList.add('option');
        btn.onclick = () => checkAnswer(index, btn);
        optionsEl.appendChild(btn);
    });
}

function checkAnswer(index, btn) {
    if(answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll('.option');

    if(index === q.correct) {
        btn.classList.add('correct');
        score++;
        document.getElementById('correctSound').play();
    } else {
        btn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        document.getElementById('wrongSound').play();
    }

    scoreEl.innerHTML = `Score: ${score}`;
    nextBtn.style.display = 'inline-block';
}

function nextQuestion() {
    currentQuestion++;

    if(currentQuestion < questions.length) {
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    questionEl.innerHTML = '🎉 Quiz Complete!';
    optionsEl.innerHTML = '';
    progressEl.innerHTML = '';
    nextBtn.style.display = 'none';

    const percent = Math.round((score / questions.length) * 100);

    resultEl.innerHTML = `
        Final Score: ${score}/${questions.length}<br>
        Percentage: ${percent}%
    `;

    document.getElementById('restartBtn').style.display = 'inline-block';
}

function restartQuiz() {
    location.reload();
}

loadQuestion();

let time = 3600;

const timer = setInterval(() => {
    const minutes = Math.floor(time / 60);
    const seconds = time % 60;

    document.getElementById('timer').innerHTML =
        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

    if(time <= 0) {
        clearInterval(timer);
        finishQuiz();
    }

    time--;
}, 1000);
</script>

</body>
</html>
